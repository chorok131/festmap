<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>축제지도 · 현위치 보기</title>
  <meta name="description" content="행사 약도 위에서 내 현재 위치와 방향을 실시간으로 보여주는 길찾기 지도." />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="축제지도" />
  <!-- Leaflet 자체 호스팅: 행사장 혼잡망에서 외부 CDN 장애점 제거 + 오프라인 동작 -->
  <link rel="stylesheet" href="vendor/leaflet.css" />
  <script src="vendor/leaflet.js"></script>
  <script src="firebase-config.js"></script>
  <script src="analytics.js"></script>
  <style>
    html, body { margin: 0; height: 100%; font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; }
    #map { position: absolute; inset: 0; background: #eef0f2; }
    #bar {
      position: absolute; z-index: 1000; top: 10px; left: 10px; right: 10px;
      display: flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,.95); padding: 8px 12px; border-radius: 12px;
      box-shadow: 0 2px 10px rgba(0,0,0,.15);
    }
    #home { text-decoration: none; color: #2563eb; font-weight: 700; font-size: 18px; line-height: 1; }
    #title { font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #bar .sp { flex: 1; }
    #go { border: 0; border-radius: 8px; padding: 9px 14px; background: #2563eb; color: #fff; font-size: 14px; font-weight: 600; }
    #status { position: absolute; z-index: 1000; left: 10px; right: 10px; bottom: 10px;
      background: rgba(255,255,255,.95); padding: 8px 12px; border-radius: 10px; font-size: 12px; color: #555;
      box-shadow: 0 2px 10px rgba(0,0,0,.12); }
    #status.warn { background: #fff7ed; color: #9a3412; }
    #follow { position: absolute; z-index: 1000; right: 14px; bottom: 56px; display: none;
      align-items: center; gap: 6px; border: 0; border-radius: 22px; padding: 9px 14px;
      background: #fff; color: #374151; font-size: 13px; font-weight: 600; box-shadow: 0 2px 10px rgba(0,0,0,.22); }
    #follow.on { background: #2563eb; color: #fff; }
    #follow .ic { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    .me { position: relative; width: 0; height: 0; }
    .me .cone { position: absolute; left: -60px; top: -60px; width: 120px; height: 120px;
      transform-origin: center center; will-change: transform; }
    .me .dot { position: absolute; left: -9px; top: -9px; width: 18px; height: 18px; border-radius: 50%;
      background: #1d4ed8; border: 3px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.2), 0 1px 4px rgba(0,0,0,.4); }

    /* POI: 검색 + 카테고리 칩 바 */
    #poibar { position: absolute; z-index: 1000; top: 56px; left: 10px; right: 10px; display: none; flex-direction: column; gap: 6px; }
    #poibar.on { display: flex; }
    #search { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,.96);
      border-radius: 10px; padding: 6px 10px; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
    #search input { border: 0; outline: 0; flex: 1; font-size: 14px; background: transparent; }
    #chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; -webkit-overflow-scrolling: touch; }
    #chips::-webkit-scrollbar { display: none; }
    .chip { flex: 0 0 auto; border: 0; border-radius: 18px; padding: 7px 12px; font-size: 13px; font-weight: 600;
      background: rgba(255,255,255,.96); color: #374151; box-shadow: 0 2px 8px rgba(0,0,0,.15); white-space: nowrap; }
    .chip.on { background: #2563eb; color: #fff; }
    /* 검색 결과 드롭다운 */
    #results { background: rgba(255,255,255,.98); border-radius: 10px; box-shadow: 0 4px 14px rgba(0,0,0,.2);
      max-height: 46vh; overflow-y: auto; display: none; }
    #results.on { display: block; }
    #results .row { padding: 10px 12px; font-size: 14px; border-bottom: 1px solid #f0f0f0; display: flex; gap: 8px; align-items: center; }
    #results .row:last-child { border-bottom: 0; }
    #results .row .ic { font-size: 16px; }
    #results .row .sub { color: #9ca3af; font-size: 12px; }
    /* POI 핀 */
    .poi { width: 26px; height: 26px; margin-left: -13px; margin-top: -26px; border-radius: 50% 50% 50% 0;
      background: var(--c, #2563eb); transform: rotate(-45deg); box-shadow: 0 1px 4px rgba(0,0,0,.4);
      display: flex; align-items: center; justify-content: center; border: 2px solid #fff; }
    .poi span { transform: rotate(45deg); font-size: 12px; line-height: 1; }
    .poi.target { width: 32px; height: 32px; margin-left: -16px; margin-top: -32px; z-index: 5; }
    /* 목표 안내 바 */
    #navbar { position: absolute; z-index: 1001; left: 10px; right: 10px; bottom: 44px; display: none;
      align-items: center; gap: 10px; background: #111827; color: #fff; border-radius: 12px; padding: 10px 14px;
      box-shadow: 0 4px 14px rgba(0,0,0,.3); font-size: 13px; }
    #navbar.on { display: flex; }
    #navbar b { font-size: 15px; }
    #navbar .sp { flex: 1; }
    #navbar .dist { font-weight: 700; color: #93c5fd; }
    #navClose { border: 0; background: rgba(255,255,255,.15); color: #fff; border-radius: 8px; padding: 6px 10px; font-size: 13px; }
    #poiToggle { border: 0; border-radius: 8px; padding: 9px 12px; background: #e5e7eb; color: #111; font-size: 14px; font-weight: 600; }
    #share { border: 0; border-radius: 8px; padding: 9px 11px; background: #e5e7eb; color: #111; font-size: 14px; }
    #toast { position: absolute; z-index: 1002; left: 50%; bottom: 92px; transform: translateX(-50%);
      background: #111827; color: #fff; padding: 10px 16px; border-radius: 20px; font-size: 13px;
      opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; max-width: 90vw; box-shadow: 0 4px 14px rgba(0,0,0,.3); }
    #toast.on { opacity: .96; }
  </style>
</head>
<body>
  <div id="bar">
    <a id="home" href="index.html" title="행사 목록">‹</a>
    <span id="title">축제지도</span>
    <span class="sp"></span>
    <button id="poiToggle" style="display:none">🔍 찾기</button>
    <button id="share" title="내 위치 링크 공유">📤</button>
    <button id="go">내 위치</button>
  </div>
  <div id="toast"></div>
  <div id="poibar">
    <div id="search"><span>🔍</span><input id="q" type="text" placeholder="화장실, 정원 이름, C25…" autocomplete="off" /></div>
    <div id="results"></div>
    <div id="chips"></div>
  </div>
  <div id="map"></div>
  <button id="follow"><span class="ic"></span><span id="followTxt">따라가기</span></button>
  <div id="navbar">
    <span>🎯 <b id="navName">목표</b></span>
    <span class="sp"></span>
    <span class="dist" id="navDist"></span>
    <button id="navClose">해제</button>
  </div>
  <div id="status">지도 불러오는 중…</div>

  <script>
    // 구형 브라우저 안전망: 아래 메인 스크립트가 문법 오류 등으로 죽으면(아주 오래된 폰) 안내만이라도 띄움
    (function () {
      var shown = false;
      window.addEventListener('error', function (ev) {
        if (shown) return;
        if (ev && ev.target && ev.target !== window) return; // 리소스 로드 실패는 별도 처리
        var s = document.getElementById('status');
        if (s) { shown = true; s.textContent = '이 브라우저에서는 지도를 표시할 수 없어요. 크롬/사파리 최신 버전으로 열어주세요.'; s.className = 'warn'; }
      });
    })();
  </script>
  <script>
    const LOCATE_ZOOM = 1;
    // ── 어느 행사인가: ?event=슬러그 (없으면 목록으로) ──────────────
    const SLUG = new URLSearchParams(location.search).get('event');
    if (!SLUG) { location.replace('index.html'); }
    const BASE = `events/${SLUG}/`;

    const map = L.map('map', { crs: L.CRS.Simple, minZoom: -6, maxZoom: 4, zoomControl: true, attributionControl: false, fadeAnimation: true });
    const statusEl = document.getElementById('status');
    const setStatus = (t, warn) => { statusEl.textContent = t; statusEl.classList.toggle('warn', !!warn); };

    const R = 6378137.0, rad = Math.PI / 180;
    const mx = (lng) => R * lng * rad;
    const my = (lat) => R * Math.log(Math.tan(Math.PI / 4 + lat * rad / 2));

    let W = 0, H = 0, hom = null, northAngle = 0;
    let meMarker = null, accCircle = null, coneEl = null, heading = 0;
    let located = false, follow = false;
    let lastLatLng = null;                 // 마지막 내 위치(지도 픽셀 좌표, 목표 거리용)
    let lastGPS = null;                    // 마지막 내 위치(실제 GPS lat/lng, 공유용)
    let dest = null, destLine = null, destMarker = null;  // 목표 지점
    let PPM0 = 1;                          // 행사 중심의 픽셀/미터(거리 폴백)

    function solveLinear(A, b) {
      const n = b.length, M = A.map((r, i) => r.concat([b[i]]));
      for (let col = 0; col < n; col++) {
        let piv = col; for (let r = col + 1; r < n; r++) if (Math.abs(M[r][col]) > Math.abs(M[piv][col])) piv = r;
        [M[col], M[piv]] = [M[piv], M[col]];
        const d = M[col][col]; if (Math.abs(d) < 1e-15) continue;
        for (let r = 0; r < n; r++) if (r !== col) { const f = M[r][col] / d; for (let c = col; c <= n; c++) M[r][c] -= f * M[col][c]; }
      }
      return M.map((row, i) => row[n] / row[i]);
    }
    function buildHom(c) {
      const src = ['topLeft', 'topRight', 'bottomLeft', 'bottomRight'].map(k => [mx(c[k].lng), my(c[k].lat)]);
      const dst = [[0, 0], [W, 0], [0, H], [W, H]];
      const A = [], b = [];
      for (let i = 0; i < 4; i++) {
        const [X, Y] = src[i], [px, py] = dst[i];
        A.push([X, Y, 1, 0, 0, 0, -px * X, -px * Y]); b.push(px);
        A.push([0, 0, 0, X, Y, 1, -py * X, -py * Y]); b.push(py);
      }
      return solveLinear(A, b);
    }
    function toPixel(lat, lng) {
      const X = mx(lng), Y = my(lat), w = hom[6] * X + hom[7] * Y + 1;
      return [(hom[0] * X + hom[1] * Y + hom[2]) / w, (hom[3] * X + hom[4] * Y + hom[5]) / w];
    }
    const pxToLatLng = (px, py) => [H - py, px];
    function pxPerMeter(lat, lng) {
      const a = toPixel(lat, lng), b = toPixel(lat + 1 / 111320, lng);
      return Math.hypot(b[0] - a[0], b[1] - a[1]);
    }

    function coneSVG() {
      const r = 50, half = 28 * rad;
      const x1 = 60 + r * Math.cos(-half), y1 = 60 + r * Math.sin(-half);
      const x2 = 60 + r * Math.cos(half), y2 = 60 + r * Math.sin(half);
      return `<svg width="120" height="120">
        <defs><radialGradient id="g" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.9"/>
          <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05"/></radialGradient></defs>
        <path d="M60,60 L${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 0 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z"
          fill="url(#g)" stroke="#1d4ed8" stroke-width="2"/></svg>`;
    }
    function meIconHtml() { return `<div class="me"><div class="cone">${coneSVG()}</div><div class="dot"></div></div>`; }
    function applyCone() {
      if (!meMarker) return;
      if (!coneEl) { const el = meMarker.getElement(); coneEl = el && el.querySelector('.cone'); }
      if (coneEl) coneEl.style.transform = `rotate(${northAngle * 180 / Math.PI + heading}deg)`;
    }
    function ensureMarker(ll) {
      if (meMarker) return;
      meMarker = L.marker(ll, { icon: L.divIcon({ className: '', iconSize: [0, 0], html: meIconHtml() }), interactive: false, zIndexOffset: 1000 }).addTo(map);
      applyCone();
    }

    function showMe(lat, lng, acc) {
      const [px, py] = toPixel(lat, lng);
      const ll = pxToLatLng(px, py);
      lastLatLng = ll;
      lastGPS = { lat: lat, lng: lng };
      const outside = px < 0 || px > W || py < 0 || py > H;
      const ppm = pxPerMeter(lat, lng);
      updateDest(ppm);

      const accPx = (acc || 0) * ppm;
      if (!accCircle) accCircle = L.circle(ll, { radius: accPx, color: '#1d4ed8', weight: 1, opacity: .4, fillColor: '#3b82f6', fillOpacity: .12, interactive: false }).addTo(map);
      else { accCircle.setLatLng(ll); accCircle.setRadius(accPx); }

      ensureMarker(ll);
      meMarker.setLatLng(ll);
      applyCone();

      if (!located) { located = true; follow = true; updateFollowBtn(); map.flyTo(ll, LOCATE_ZOOM, { duration: 0.8 }); }
      else if (follow && !outside) map.panTo(ll, { animate: true, duration: 0.5 });

      // [D의 씨앗] 동선/체류시간 리포트의 원천. 지금은 외부 전송 없음(analytics.js 참고).
      Festmap.ping({ event: SLUG, lat: +lat.toFixed(6), lng: +lng.toFixed(6), acc: Math.round(acc || 0), inside: !outside });

      if (outside) {
        const cx = Math.min(Math.max(px, 0), W), cy = Math.min(Math.max(py, 0), H);
        const m = Math.round(Math.hypot(px - cx, py - cy) / Math.max(ppm, 1e-6));
        setStatus(`현위치가 약도 범위 밖이에요 (약 ${m}m). 행사장 안에서 다시 확인하세요.`, true);
      } else {
        setStatus(`내 위치 표시 중 · 정확도 ±${Math.round(acc || 0)}m · 방향 ${Math.round(heading)}° · 따라가기 ${follow ? 'ON' : 'OFF'}`);
      }
    }

    const followBtn = document.getElementById('follow');
    function updateFollowBtn() {
      followBtn.style.display = located ? 'inline-flex' : 'none';
      followBtn.classList.toggle('on', follow);
      document.getElementById('followTxt').textContent = follow ? '따라가는 중' : '따라가기';
    }
    followBtn.addEventListener('click', () => {
      follow = !follow; updateFollowBtn();
      if (follow && meMarker) map.panTo(meMarker.getLatLng(), { animate: true });
    });
    map.on('dragstart', () => { if (follow) { follow = false; updateFollowBtn(); } });

    (async function init() {
      setStatus('지도 불러오는 중…');
      let g;
      try {
        g = await (await fetch(BASE + 'georef.json')).json();
      } catch (e) {
        setStatus('이 행사 데이터를 찾을 수 없어요. 목록으로 돌아갑니다…', true);
        setTimeout(() => location.replace('index.html'), 1500);
        return;
      }
      document.title = (g.event || '축제지도') + ' · 현위치 지도';
      document.getElementById('title').textContent = g.event || '축제지도';
      Festmap.setConfig({ mode: g.track || 'counts' });   // 행사별: 'counts'(기본) | 'full'(동선) | 'off'
      const imgUrl = BASE + g.image;
      const loaded = await new Promise((res) => {
        const im = new Image();
        im.onload = () => { W = im.naturalWidth; H = im.naturalHeight; res(true); };
        im.onerror = () => res(false);
        im.src = imgUrl;
      });
      if (!loaded) {
        setStatus('약도 이미지를 불러오지 못했어요. 신호가 잡히는 곳에서 새로고침 해주세요.', true);
        return;
      }
      const bounds = [[0, 0], [H, W]];
      L.imageOverlay(imgUrl, bounds).addTo(map);
      map.fitBounds(bounds);
      hom = buildHom(g.corners);
      const refLat = (g.corners.topLeft.lat + g.corners.bottomRight.lat) / 2;
      const refLng = (g.corners.topLeft.lng + g.corners.bottomRight.lng) / 2;
      const p0 = toPixel(refLat, refLng), p1 = toPixel(refLat + 0.001, refLng);
      northAngle = Math.atan2(p1[1] - p0[1], p1[0] - p0[0]);
      PPM0 = pxPerMeter(refLat, refLng);
      setStatus('"내 위치"를 눌러 현재 위치를 약도 위에 표시하세요. (위치·나침반 권한 허용 필요)');
      Festmap.track('open', { event: SLUG });
      pinLayer.addTo(map);   // 핀 레이어는 항상(공유 위치는 pois 없어도 표시)
      setupPois();           // 핀/검색/길찾기 (pois.json 있으면)
      showShared();          // 공유받은 위치(?at=) 있으면 표시
    })();

    // ───────────────── POI: 시설 찾기 + 길찾기 ─────────────────
    const CAT = {
      toilet:    { label: '화장실',  emoji: '🚻', color: '#2563eb' },
      store:     { label: '편의점',  emoji: '🏪', color: '#16a34a' },
      cafe:      { label: '카페',    emoji: '☕', color: '#a16207' },
      foodtruck: { label: '푸드트럭', emoji: '🍔', color: '#ea580c' },
      parking:   { label: '주차장',  emoji: '🅿️', color: '#475569' },
      info:      { label: '안내소',  emoji: 'ℹ️', color: '#0891b2' },
      nursing:   { label: '수유실',  emoji: '🍼', color: '#db2777' },
      stroller:  { label: '유모차',  emoji: '🍼', color: '#db2777' },
      wheelchair:{ label: '휠체어',  emoji: '♿', color: '#db2777' },
      bus:       { label: '버스',    emoji: '🚌', color: '#7c3aed' },
      subway:    { label: '지하철',  emoji: '🚇', color: '#7c3aed' },
      garden:    { label: '정원',    emoji: '🌳', color: '#15803d' },
      shared:    { label: '공유 위치', emoji: '📍', color: '#e11d48' }
    };
    // 칩에 노출할 순서(데이터에 있는 것만)
    const CHIP_ORDER = ['toilet', 'store', 'cafe', 'foodtruck', 'parking', 'info', 'nursing', 'bus', 'garden'];

    let POIS = [], pinLayer = L.layerGroup(), activeCats = new Set();
    const poiLatLng = (p) => L.latLng(H - p.y, p.x);

    function pinIcon(cat, target) {
      const c = CAT[cat] || { emoji: '📍', color: '#2563eb' };
      return L.divIcon({ className: '', iconSize: [0, 0],
        html: `<div class="poi${target ? ' target' : ''}" style="--c:${c.color}"><span>${c.emoji}</span></div>` });
    }

    async function setupPois() {
      let data;
      try { data = await (await fetch(BASE + 'pois.json')).json(); } catch (e) { return; } // 없으면 조용히 패스
      POIS = (data.pois || []).filter(p => p && p.x != null && p.y != null);
      if (!POIS.length) return;
      pinLayer.addTo(map);
      document.getElementById('poiToggle').style.display = '';
      buildChips();
      bindSearch();
      // 기본: 화장실 켜기(가장 많이 찾는 것)
      if (POIS.some(p => p.cat === 'toilet')) { activeCats.add('toilet'); }
      document.getElementById('poibar').classList.add('on');
      renderPins();
      syncChips();
    }

    function buildChips() {
      const have = new Set(POIS.map(p => p.cat));
      const box = document.getElementById('chips');
      box.innerHTML = '';
      CHIP_ORDER.filter(c => have.has(c)).forEach(cat => {
        const n = POIS.filter(p => p.cat === cat).length;
        const b = document.createElement('button');
        b.className = 'chip'; b.dataset.cat = cat;
        b.textContent = `${(CAT[cat] || {}).emoji || ''} ${(CAT[cat] || {}).label || cat} ${n}`;
        b.onclick = () => { activeCats.has(cat) ? activeCats.delete(cat) : activeCats.add(cat); renderPins(); syncChips(); };
        box.appendChild(b);
      });
    }
    function syncChips() {
      document.querySelectorAll('.chip').forEach(b => b.classList.toggle('on', activeCats.has(b.dataset.cat)));
    }

    function renderPins() {
      pinLayer.clearLayers();
      POIS.filter(p => activeCats.has(p.cat)).forEach(p => addPin(p));
      if (dest) addPin(dest, true);   // 목표는 항상 표시
    }
    function addPin(p, target) {
      const m = L.marker(poiLatLng(p), { icon: pinIcon(p.cat, target), zIndexOffset: target ? 900 : 400 }).addTo(pinLayer);
      m.on('click', () => openPoi(p));
    }

    function openPoi(p) {
      const c = CAT[p.cat] || {};
      const html = `<div style="min-width:140px">
        <div style="font-weight:700;font-size:14px;margin-bottom:6px">${c.emoji || '📍'} ${p.name || c.label || ''}${p.id ? ' <span style="color:#9ca3af">(' + p.id + ')</span>' : ''}</div>
        <button onclick="window._setDest(${p.x},${p.y})" style="border:0;border-radius:8px;padding:8px 12px;background:#2563eb;color:#fff;font-weight:600;font-size:13px;width:100%">여기로 가기 ▸</button>
      </div>`;
      L.popup({ closeButton: true, autoPan: true }).setLatLng(poiLatLng(p)).setContent(html).openOn(map);
    }

    // 검색
    function bindSearch() {
      const q = document.getElementById('q'), res = document.getElementById('results');
      q.addEventListener('input', () => {
        const v = q.value.trim().toLowerCase();
        if (!v) { res.classList.remove('on'); res.innerHTML = ''; return; }
        const hits = POIS.filter(p =>
          (p.name || '').toLowerCase().includes(v) ||
          (p.id || '').toLowerCase().includes(v) ||
          ((CAT[p.cat] || {}).label || '').includes(v)
        ).slice(0, 20);
        res.innerHTML = hits.map(p => {
          const c = CAT[p.cat] || {};
          return `<div class="row" data-x="${p.x}" data-y="${p.y}">
            <span class="ic">${c.emoji || '📍'}</span>
            <span>${p.name || c.label || ''}${p.id ? ' <span class="sub">' + p.id + '</span>' : ''}</span></div>`;
        }).join('') || '<div class="row"><span class="sub">검색 결과가 없어요</span></div>';
        res.classList.add('on');
        res.querySelectorAll('.row[data-x]').forEach(row => {
          row.onclick = () => {
            const x = +row.dataset.x, y = +row.dataset.y;
            const p = POIS.find(pp => pp.x === x && pp.y === y);
            res.classList.remove('on'); q.value = '';
            map.setView(poiLatLng(p), 2, { animate: true });
            openPoi(p);
          };
        });
      });
    }

    // 목표 지점
    window._setDest = function (x, y) {
      dest = POIS.find(p => p.x === x && p.y === y) || { x, y, cat: 'garden', name: '목표' };
      map.closePopup();
      if (destMarker) pinLayer.removeLayer(destMarker);
      renderPins();
      document.getElementById('navName').textContent = dest.name || '목표';
      document.getElementById('navbar').classList.add('on');
      updateDest(PPM0);
      if (!located) setStatus('"내 위치"를 누르면 목표까지 거리와 방향이 표시돼요.');
    };
    document.getElementById('navClose').onclick = () => {
      dest = null; document.getElementById('navbar').classList.remove('on');
      if (destLine) { map.removeLayer(destLine); destLine = null; }
      renderPins();
    };
    function updateDest(ppm) {
      if (!dest) return;
      const dll = poiLatLng(dest);
      if (lastLatLng) {
        if (!destLine) destLine = L.polyline([lastLatLng, dll], { color: '#111827', weight: 3, dashArray: '6 6', opacity: .8 }).addTo(map);
        else destLine.setLatLngs([lastLatLng, dll]);
        const dx = dll.lng - lastLatLng[1], dy = dll.lat - lastLatLng[0];  // lastLatLng=[lat,lng] 배열
        const m = Math.round(Math.hypot(dx, dy) / Math.max(ppm || PPM0 || 1, 1e-6));
        document.getElementById('navDist').textContent = '약 ' + m + 'm';
      } else {
        document.getElementById('navDist').textContent = '내 위치 필요';
      }
    }

    document.getElementById('poiToggle').onclick = () => {
      document.getElementById('poibar').classList.toggle('on');
    };

    // ───────────── 내 위치 공유 (라이트: 좌표를 링크에 담음, 서버 불필요) ─────────────
    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg; el.classList.add('on');
      clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 2800);
    }
    function shareMyLocation() {
      if (!lastGPS) { setStatus('먼저 "내 위치"를 눌러 위치를 잡은 뒤 공유하세요.'); return; }
      const url = location.origin + location.pathname
        + '?event=' + encodeURIComponent(SLUG)
        + '&at=' + lastGPS.lat.toFixed(6) + ',' + lastGPS.lng.toFixed(6)
        + '&t=' + Date.now();
      const text = '내 위치 — ' + (document.getElementById('title').textContent || '축제지도');
      Festmap.track('share_loc', { event: SLUG });
      if (navigator.share) {
        navigator.share({ title: '내 위치', text, url }).catch(() => {});
      } else if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(() => toast('📋 위치 링크 복사됨 — 친구에게 붙여넣어 보내세요')).catch(() => prompt('이 링크를 복사해 보내세요', url));
      } else {
        prompt('이 링크를 복사해 보내세요', url);
      }
    }
    document.getElementById('share').onclick = shareMyLocation;

    // 공유받은 위치 표시 (?at=lat,lng[&t=epoch])
    function showShared() {
      const sp = new URLSearchParams(location.search);
      const at = sp.get('at');
      if (!at) return;
      const [la, ln] = at.split(',').map(Number);
      if (!isFinite(la) || !isFinite(ln)) return;
      const [px, py] = toPixel(la, ln);
      if (px < 0 || px > W || py < 0 || py > H) { setStatus('공유받은 위치가 이 약도 범위 밖이에요.', true); return; }
      dest = { x: Math.round(px), y: Math.round(py), cat: 'shared', name: '공유받은 위치' };
      const t = +sp.get('t');
      const ago = t ? ' · ' + Math.max(0, Math.round((Date.now() - t) / 60000)) + '분 전' : '';
      renderPins();
      map.setView(poiLatLng(dest), 1);
      document.getElementById('navName').textContent = '공유받은 위치' + ago;
      document.getElementById('navbar').classList.add('on');
      updateDest(PPM0);
      setStatus('📍 친구가 공유한 위치예요. "내 위치"를 누르면 여기까지 거리·방향이 표시돼요.');
    }

    function onOrient(e) {
      let h = (e.webkitCompassHeading != null) ? e.webkitCompassHeading
            : (e.absolute && e.alpha != null) ? (360 - e.alpha) : null;
      if (h != null) { heading = h; applyCone(); }
    }
    document.getElementById('go').addEventListener('click', async () => {
      setStatus('권한 요청 중…');
      Festmap.track('locate_tap', { event: SLUG });
      try {
        if (window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function') {
          const s = await DeviceOrientationEvent.requestPermission();
          if (s === 'granted') window.addEventListener('deviceorientation', onOrient, true);
        } else {
          window.addEventListener('deviceorientationabsolute', onOrient, true);
          window.addEventListener('deviceorientation', onOrient, true);
        }
      } catch (e) {}
      if (!navigator.geolocation) { setStatus('이 브라우저는 위치를 지원하지 않습니다.', true); return; }
      setStatus('내 위치 찾는 중…');
      follow = true;
      navigator.geolocation.watchPosition(
        (p) => showMe(p.coords.latitude, p.coords.longitude, p.coords.accuracy),
        (err) => setStatus('위치 오류: ' + err.message + ' (https에서만 동작)', true),
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 15000 }
      );
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
