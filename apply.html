<head>
  <meta charset="utf-8" />

  <link rel="canonical" href="https://minimap.kr/apply.html" />

  <style>
    :root { --blue:#2563eb; --ink:#111827; --muted:#6b7280; --line:#e5e7eb; --bg:#f8fafc; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; color: var(--ink); background: #fff; line-height: 1.6; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px; }
    a.back { display: inline-block; margin: 20px 0 0; color: var(--blue); text-decoration: none; font-weight: 600; font-size: 14px; }

    header.hero { padding: 16px 0 28px; }
    .hero h1 { font-size: clamp(24px,5vw,32px); margin: 10px 0 10px; letter-spacing: -.5px; }
    .hero p { color: #374151; font-size: 16px; margin: 0; }

    section { padding: 12px 0 28px; }
    h2 { font-size: 19px; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 14px; margin: 0 0 18px; }

    /* 유무 선택 카드 */
    .choices { display: grid; gap: 12px; grid-template-columns: 1fr; margin-top: 6px; }
    @media (min-width: 600px) { .choices { grid-template-columns: 1fr 1fr; } }
    .choice { text-align: left; border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 18px; cursor: pointer; transition: border-color .15s, background .15s; }
    .choice:hover { border-color: #93c5fd; }
    .choice.on { border-color: var(--blue); background: #eff6ff; }
    .choice .t { font-weight: 700; font-size: 16px; margin: 0 0 4px; }
    .choice .d { font-size: 13px; color: var(--muted); margin: 0; }

    /* 결과 패널 + 신청 */
    #panel { display: none; margin-top: 22px; border: 1px solid var(--line); border-radius: 16px; padding: 22px; background: var(--bg); }
    #panel.on { display: block; }
    #panel .note { font-size: 14px; color: #374151; margin: 0 0 16px; }
    #panel .note b { color: var(--ink); }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
    .field input, .field textarea { width: 100%; border: 1px solid #d1d5db; border-radius: 8px; padding: 10px 12px; font-size: 14px; font-family: inherit; }
    .field textarea { min-height: 64px; resize: vertical; }
    .submit { display: inline-flex; align-items: center; gap: 6px; border: 0; border-radius: 10px; padding: 13px 22px; background: var(--blue); color: #fff; font-weight: 700; font-size: 15px; text-decoration: none; cursor: pointer; }
    .attach { font-size: 13px; color: #92400e; background: #fef3c7; border-radius: 8px; padding: 10px 12px; margin: 14px 0; }

    .ctabox { background: linear-gradient(135deg,#1e3a8a,#2563eb); border-radius: 16px; padding: 30px 24px; text-align: center; color: #fff; }
    .ctabox h2 { color: #fff; margin: 0 0 6px; font-size: 20px; }
    .ctabox p { color: #dbeafe; font-size: 14px; margin: 0 0 20px; }
    .ctabox .cta { display: inline-block; background: #fff; color: var(--blue); font-weight: 800; text-decoration: none; padding: 14px 28px; border-radius: 10px; font-size: 16px; }
    footer { border-top: 1px solid var(--line); padding: 24px 0 48px; color: var(--muted); font-size: 13px; text-align: center; }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">‹ 미니맵</a>

    <header class="hero">
      <h1>행사 지도, 만들어 드립니다</h1>
      <p>행사 약도를 주시면 <b>약도 위에서 관람객이 자기 위치를 실시간으로 보는 지도</b>로 제작해 드려요. 1분이면 문의 끝.</p>
    </header>

    <section>
      <div class="ctabox">
        <h2>약도(배치도)만 준비해 주세요</h2>
        <p>손그림·PDF·사진 무엇이든 OK. <b>1분이면 문의 끝</b> · 연락처는 마지막에 회신용으로만 받아요.</p>
        <a class="cta" href="https://docs.google.com/forms/d/e/1FAIpQLSdQiEWdbDwr1fQlOy38mnsCN8Pk7aILoDJwN5rOXpudqhgnAw/viewform" target="_blank" rel="noopener">📝 1분 신청하기 ▸</a>
      </div>
    </section>
  </div>

  <footer>
    <div class="wrap">미니맵 · minimap.kr · 문의 crok2test@gmail.com</div>
  </footer>

</body>
</html>
